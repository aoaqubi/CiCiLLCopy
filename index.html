<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  header{
  position:fixed;

  top:0;
  left:0;

  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:25px 5vw;

  background:rgba(0,0,0,0.7);

  backdrop-filter:blur(10px);

  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

nav{
  display:flex;
  gap:30px;
}

nav a{
  color:white;
  text-decoration:none;

  transition:.3s;
}

nav a:hover{
  opacity:.6;
}
  
}

body{
  background:#0d0d0d;
  color:white;
  font-family:Arial,sans-serif;
}

.hero{
  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:0 10vw;
}

.hero h1{
  font-size:clamp(60px,10vw,140px);
  font-weight:700;
}

.hero p{
  margin-top:20px;
  color:#999;
  font-size:20px;
}

.skull{
  margin-top:40px;

  display:inline-block;

  padding:16px 40px;

  border:1px solid white;

  color:black;
  text-decoration:none;

  transition:.3s;
}

.skull:hover{
  background:black;
  color:red;
}

.solutions{
  padding:120px 10vw;
}

.solutions h2{
  font-size:48px;
  margin-bottom:50px;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

  gap:30px;
}

.card{
  border:1px solid #333;

  padding:40px;

  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:white;
}

.card h3{
  margin-bottom:15px;
  font-size:24px;
}

.card p{
  color:#999;
  line-height:1.8;
}
</style>
</head>

<body>

  <header>
  <div class="logo">SMASH BROS.</div>

  <nav>
    <a href="#">ホーム</a>
    <a href="#">大乱闘</a>
    <a href="#">南のボードショップ</a>
    <a href="#">北のボードショップ</a>
  </nav>
</header>
  
<section class="hero">

<h1>SMASH BROS.</h1>

<p>
ニンテンドウオールスター
</p>

<a href="skull.html">
  <button class="skull">クリックで覗いてみよう</button>
</a>

</section>

<section class="solutions">

<h2>Go To Hell</h2>

<div class="grid">

<div class="card">
<h3>Skull System</h3>
<p>
燃えるどくろがおばあちゃんの家に落ちる
</p>
</div>

<div class="card">
<h3>No Dokuro No Life</h3>
<p>
喉黒の人生
</p>
</div>

<div class="card">
<h3>Persona</h3>
<p>
ペルソナを解放する
</p>
</div>

</div>

</section>

</body>
</html>
