<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0d0d0d;
  color:white;
  font-family:Arial,sans-serif;
}

.hero{
  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:0 10vw;
}

.hero h1{
  font-size:clamp(60px,10vw,140px);
  font-weight:700;
}

.hero p{
  margin-top:20px;
  color:#999;
  font-size:20px;
}

.skull{
  margin-top:40px;

  display:inline-block;

  padding:16px 40px;

  border:1px solid white;

  color:white;
  text-decoration:none;

  transition:.3s;
}

.skull:hover{
  background:white;
  color:black;
}

.solutions{
  padding:120px 10vw;
}

.solutions h2{
  font-size:48px;
  margin-bottom:50px;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

  gap:30px;
}

.card{
  border:1px solid #333;

  padding:40px;

  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:white;
}

.card h3{
  margin-bottom:15px;
  font-size:24px;
}

.card p{
  color:#999;
  line-height:1.8;
}
</style>
</head>

<body>

<section class="hero">

<h1>SISILLWARE</h1>

<p>
Digital Solutions for the Future
</p>

<a href="skull.html">
  <button class="skull">クリックで覗いてみよう</button>
</a>

</section>

<section class="solutions">

<h2>SOLUTION</h2>

<div class="grid">

<div class="card">
<h3>System Development</h3>
<p>
Webシステム開発
</p>
</div>

<div class="card">
<h3>Cloud Services</h3>
<p>
クラウド導入支援
</p>
</div>

<div class="card">
<h3>Security</h3>
<p>
セキュリティ対策
</p>
</div>

</div>

</section>

</body>
</html>
