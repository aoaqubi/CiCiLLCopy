<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  margin:0;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

.skull-container{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.skull{
  position:absolute;
  width:80px;
  height:80px;

  opacity:0;
  animation: attack 2s linear forwards;
}

@keyframes attack{
  0%{
    transform: scale(0.2) translateY(200px);
    opacity:0;
  }
  30%{
    opacity:1;
  }
  100%{
    transform: scale(1.5) translateY(-200px);
    opacity:0;
  }
}
}
</style>
</head>

<body>

<div class="skull-container"></div>

</body>
  
<img class="skull" src="skull.png">
  
<audio autoplay loop>
  <source src="heri.mp3" type="audio/mpeg">
</audio>

</body>
</html>

</body>
</html>
