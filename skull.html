<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:black;
  overflow:hidden;
  margin:0;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

  body{
  background:black;
  overflow:hidden;
}

.skull-container{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.skull{
  position:absolute;
  font-size:60px;

  opacity:0;
  animation: attack 1.5s infinite;
}

/* ランダム配置 */
.skull:nth-child(1){ left:10%; top:20%; animation-delay:0s; }
.skull:nth-child(2){ left:70%; top:10%; animation-delay:0.2s; }
.skull:nth-child(3){ left:40%; top:60%; animation-delay:0.4s; }
.skull:nth-child(4){ left:80%; top:70%; animation-delay:0.6s; }
.skull:nth-child(5){ left:20%; top:80%; animation-delay:0.8s; }

@keyframes attack{
  0%{
    transform: scale(0.2) translateY(200px);
    opacity:0;
  }
  30%{
    opacity:1;
  }
  70%{
    transform: scale(1.2) translateY(0);
    opacity:1;
  }
  100%{
    transform: scale(2) translateY(-200px);
    opacity:0;
  }
}
}
</style>
</head>

<body>

<div class="skull-container">
  <div class="skull">💀</div>
  <div class="skull">💀</div>
  <div class="skull">💀</div>
  <div class="skull">💀</div>
  <div class="skull">💀</div>
</div>

</body>
  
<img class="skull" src="skull.png">
  
<audio autoplay loop>
  <source src="heri.mp3" type="audio/mpeg">
</audio>

</body>
</html>

</body>
</html>
