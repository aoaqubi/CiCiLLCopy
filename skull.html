<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:black;
  overflow:hidden;
  margin:0;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

.btn{
  width:150px;

  filter:
    drop-shadow(0 0 20px red)
    drop-shadow(0 0 50px orange);

  animation: zoom 3s infinite;
}

@keyframes zoom{
  0%{
    transform:scale(0.2);
    opacity:0;
  }

  50%{
    opacity:1;
  }

  100%{
    transform:scale(3);
    opacity:0;
  }
}
</style>
</head>

<body>
  
<img class="btn" src="skull.png">
  
<audio autoplay loop>
  <source src="heri.mp3" type="audio/mpeg">
</audio>

</body>
</html>

</body>
</html>
