<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  margin:0;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

.skull-container{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.skull{
  position:absolute;
  width:80px;
  height:80px;

  opacity:0;
  animation: attack 2s linear forwards;
}

@keyframes attack{
  0%{
    transform: scale(0.2) translateY(200px);
    opacity:0;
  }
  30%{
    opacity:1;
  }
  100%{
    transform: scale(1.5) translateY(-200px);
    opacity:0;
  }
}
}
</style>
</head>

<body>

<div class="skull-container"></div>

</body>
  
<img class="skull" src="skull.png">
  
<audio autoplay loop>
  <source src="heri.mp3" type="audio/mpeg">
</audio>

  <script>
const container = document.querySelector(".skull-container");

function spawnSkull(){

  const img = document.createElement("img");
  img.src = "skull.png";
  img.className = "skull";

  // ランダム位置
  img.style.left = Math.random() * window.innerWidth + "px";
  img.style.top = Math.random() * window.innerHeight + "px";

  // ランダムサイズ
  const size = 40 + Math.random() * 100;
  img.style.width = size + "px";
  img.style.height = size + "px";

  // ランダム遅延（自然にバラける）
  img.style.animationDuration = (1 + Math.random() * 2) + "s";

  container.appendChild(img);

  // 終わったら削除
  setTimeout(()=>{
    img.remove();
  }, 3000);
}

// 連続出現
setInterval(()=>{
  spawnSkull();
}, 200);
</script>

</body>
</html>
